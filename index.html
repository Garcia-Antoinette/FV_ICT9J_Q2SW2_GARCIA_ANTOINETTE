<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Q2 Seatwork 2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        #image1 {
            margin-bottom: 15px;
            position: absolute;
        }

        #text-center {
            position: absolute;
            text-align: center;
            margin: 310px;
            color: aliceblue;
        }

        #navbar {
            position: sticky;
        }

        #bg-img {
            position: relative;
        }

        #text1 {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-color: aliceblue;
            position: absolute;
            top: 29%;
            left: 0%;
        }

        #hours {
            position: absolute;
            top: 8%;
            left: 8%;
            width: 42%;
        }

        #contact {
            position: absolute;
            top: 8%;
            right: 8%;
            width: 22%;
            background-color: white;
            border-radius: 5px;
            padding: 15px;
        }

        #contact h2 {
            text-align: center;
            margin-bottom: 20px;
        }

    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" id="navbar">

        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                <img src="https://files.orangeapps.ph/disk001/School_Files/1/school-68/school_profile/1724046769-519.png"
                alt="ob picture" id="ob_picture"
                class="rounded-circle" style="height: 40px;width: 40px;">
            </a>

            <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#mynavbar">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="mynavbar">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="https://obmontessori.edu.ph/contactus">
                            Contact Us
                        </a>
                    </li>

                </ul>

                <form class="d-flex">

                    <input class="form-control me-2" type="text" placeholder="Search">

                    <button class="btn btn-primary" type="button">
                        Search
                    </button>

                </form>

            </div>

        </div>

    </nav>


    <header>

        <div class="container-fluid m-0 p-0">

            <div class="row" id="bg-img">

                <div class="col">

                    <img src="https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/affba656-d015-4b96-a8ba-3ef5bbbc2c39/OBMC+MONTESSORI+GH---+AY+2026+FA.jpg"
                    id="image1" class="img-fluid w-100 d-block"
                    alt="ob picture" style="height: 525px; object-fit: cover;">

                </div>

                <div class="col" id="hours">

                    <h3 class="text-center bg-light">
                        School Office Hours
                    </h3>

                    <table class="table table-striped table-bordered text-center">

                        <thead class="table-primary">

                            <tr>
                                <th>Day</th>
                                <th>Office Hours</th>
                                <th>Department</th>
                            </tr>

                        </thead>

                        <tbody>

                            <tr>
                                <td>Monday</td>
                                <td>8:00 AM - 4:00 PM</td>
                                <td>Registrar's Office</td>
                            </tr>

                            <tr>
                                <td>Tuesday</td>
                                <td>8:00 AM - 4:00 PM</td>
                                <td>Accounting Office</td>
                            </tr>

                            <tr>
                                <td>Wednesday</td>
                                <td>8:00 AM - 4:00 PM</td>
                                <td>Guidance Office</td>
                            </tr>

                            <tr>
                                <td>Thursday</td>
                                <td>8:00 AM - 4:00 PM</td>
                                <td>Principal's Office</td>
                            </tr>

                            <tr>
                                <td>Friday</td>
                                <td>8:00 AM - 3:00 PM</td>
                                <td>Admin Office</td>
                            </tr>

                        </tbody>

                    </table>

                </div>


                <div class="col" id="contact">

                    <h2>Contact Us</h2>

                    <form>

                        <div class="mb-3">

                            <label class="form-label">Full Name</label>

                            <input type="text" class="form-control"
                            placeholder="Enter your full name">

                        </div>


                        <div class="mb-3">

                            <label class="form-label">Email Address</label>

                            <input type="email" class="form-control"
                            placeholder="Enter your email">

                        </div>


                        <div class="mb-3">

                            <label class="form-label">Subject</label>

                            <input type="text" class="form-control"
                            placeholder="Enter subject">

                        </div>


                        <div class="mb-3">

                            <label class="form-label">Message</label>

                            <textarea class="form-control" rows="4"
                            placeholder="Type your message here"></textarea>

                        </div>


                        <button type="submit" class="btn btn-primary w-100">
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </header>


    <section>

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-7">

                </div>

            </div>

        </div>

    </section>

</body>
</html>
